# EAS: over-the-air updates and Android APK builds.
#
#   push to master            -> OTA update on the `preview` channel (installed preview APKs pick it up)
#   Actions > EAS > Run       -> choose: OTA update, APK build, or both (and the profile)
#   push a tag like v1.2.0    -> APK build
#
# Needs three repository secrets (set with `gh secret set`): EXPO_TOKEN (expo.dev > Settings > Access
# tokens), GOOGLE_SERVICES_JSON (the file's contents) and EXPO_PUBLIC_ENV (the EXPO_PUBLIC_* lines
# of a .env file). They are written to files at run time; nothing is stored in EAS.
#
# OTA updates only reach builds with the same runtime version (fingerprint policy): after a native
# change (native module, config plugin, native dependency), build a new APK.
name: EAS

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [update, build-apk, both]
        default: build-apk
      profile:
        description: EAS build profile / update channel
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: Update message (OTA only; defaults to the commit message)
        type: string
        required: false

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: OTA update
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.action != 'build-apk')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHANNEL: ${{ inputs.profile || 'preview' }}
      # Passed through env, never interpolated into the script, so commit text can't inject shell.
      MESSAGE: ${{ inputs.message || github.event.head_commit.message || 'Manual update' }}
    steps:
      - name: Check secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          APP_ENV: ${{ secrets.EXPO_PUBLIC_ENV }}
        run: |
          missing=""
          [ -z "$EXPO_TOKEN" ] && missing="$missing EXPO_TOKEN"
          [ -z "$GSJ" ] && missing="$missing GOOGLE_SERVICES_JSON"
          [ -z "$APP_ENV" ] && missing="$missing EXPO_PUBLIC_ENV"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see README > Automated with GitHub Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      # Secrets live in GitHub, not EAS: write them into the files the build reads. Both files are
      # git-ignored but allowed by .easignore, so they reach the EAS builder in the upload.
      - name: Write config from secrets
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          APP_ENV: ${{ secrets.EXPO_PUBLIC_ENV }}
        run: |
          printf '%s' "$GSJ" > google-services.json
          printf '%s\n' "$APP_ENV" > .env
          jq -e '.project_info.project_id' google-services.json > /dev/null

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish update
        run: eas update --channel "$CHANNEL" --environment "$CHANNEL" --message "$(echo "$MESSAGE" | head -n 1)" --non-interactive

  build-apk:
    name: Android build (${{ inputs.profile || 'preview' }})
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.action != 'update')
    runs-on: ubuntu-latest
    # EAS builds in the cloud; this job only starts it, waits, and attaches the result to the run.
    timeout-minutes: 180
    env:
      PROFILE: ${{ inputs.profile || 'preview' }}
    steps:
      - name: Check secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          APP_ENV: ${{ secrets.EXPO_PUBLIC_ENV }}
        run: |
          missing=""
          [ -z "$EXPO_TOKEN" ] && missing="$missing EXPO_TOKEN"
          [ -z "$GSJ" ] && missing="$missing GOOGLE_SERVICES_JSON"
          [ -z "$APP_ENV" ] && missing="$missing EXPO_PUBLIC_ENV"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see README > Automated with GitHub Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      # Secrets live in GitHub, not EAS: write them into the files the build reads. Both files are
      # git-ignored but allowed by .easignore, so they reach the EAS builder in the upload.
      - name: Write config from secrets
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          APP_ENV: ${{ secrets.EXPO_PUBLIC_ENV }}
        run: |
          printf '%s' "$GSJ" > google-services.json
          printf '%s\n' "$APP_ENV" > .env
          jq -e '.project_info.project_id' google-services.json > /dev/null

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build on EAS
        run: eas build --platform android --profile "$PROFILE" --non-interactive --wait --json > build.json

      - name: Download the build
        id: artifact
        run: |
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          page="https://expo.dev/accounts/$(jq -r '.[0].project.ownerAccount.name' build.json)/projects/$(jq -r '.[0].project.slug' build.json)/builds/$(jq -r '.[0].id' build.json)"
          ext=$([ "$PROFILE" = "production" ] && echo aab || echo apk)
          curl -fsSL "$url" -o "von-mini-$PROFILE.$ext"
          echo "file=von-mini-$PROFILE.$ext" >> "$GITHUB_OUTPUT"
          {
            echo "### Android build ($PROFILE)"
            echo ""
            echo "- Install page (QR code): $page"
            echo "- Direct download: $url"
            echo "- Runtime version: $(jq -r '.[0].runtimeVersion' build.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.file }}
          path: ${{ steps.artifact.outputs.file }}
          retention-days: 30
